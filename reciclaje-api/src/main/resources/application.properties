# Conexion a la base de datos que creamos
spring.datasource.url=jdbc:postgresql://localhost:5432/reciclaje_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

#Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# update = Hibernate crea o ajusta las tablas solo
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL en la consola (sirve para depurar)
spring.jpa.show-sql=true

#Formato
spring.jpa.properties.hibernate.format_sql= true

#Logs de Spring
logging.level.org.springframework=INFO

#Logs de hibernate
logging.level.org.hibernate.SQL=DEBUG

#Mostrar parametros SQL
logging.level.org.hibernate.orm.jdbc.bind=TRACE


